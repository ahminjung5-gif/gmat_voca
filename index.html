<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GMAT VOCA 플래시카드</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>" />
  <script>
    // 테마를 먼저 적용해 깜빡임 방지
    (function () {
      var t = null;
      try { t = localStorage.getItem("gmat-voca-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">

    <!-- ========== 1. 설정 화면 ========== -->
    <section id="screen-setup" class="screen active" aria-labelledby="setup-title">
      <header class="setup-head">
        <div>
          <h1 id="setup-title"><span class="logo" aria-hidden="true">🃏</span>GMAT VOCA</h1>
          <p class="lede">Day와 학습 방법을 고르고 시작해요. 목숨은 3개, 단어마다 60초!</p>
        </div>
        <button type="button" class="theme-btn" data-theme-toggle aria-label="테마 바꾸기"></button>
      </header>

      <div class="panel">
        <div class="panel-row">
          <h2>Day 선택</h2>
          <div class="quick">
            <button type="button" class="link-btn" id="btn-all">전체 선택</button>
            <button type="button" class="link-btn" id="btn-none">선택 해제</button>
          </div>
        </div>
        <div id="day-grid" class="day-grid" role="group" aria-label="Day 선택"></div>
      </div>

      <div class="panel">
        <h2>학습 방법</h2>
        <div class="mode-grid" role="radiogroup" aria-label="학습 방법">
          <label class="mode">
            <input type="radio" name="mode" value="m" checked />
            <span class="mode-body">
              <span class="mode-emoji" aria-hidden="true">📖</span>
              <strong>뜻 맞히기</strong>
              <span class="mode-desc">단어와 발음을 보고 알맞은 뜻을 골라요.</span>
            </span>
          </label>
          <label class="mode">
            <input type="radio" name="mode" value="v" />
            <span class="mode-body">
              <span class="mode-emoji" aria-hidden="true">🔗</span>
              <strong>유의어·파생어 맞히기</strong>
              <span class="mode-desc">보기마다 단어가 하나씩! 유의어·파생어인 것 또는 아닌 것을 골라요.</span>
            </span>
          </label>
        </div>
      </div>

      <div class="start-bar">
        <p id="selection-summary" aria-live="polite">Day를 하나 이상 선택하세요.</p>
        <button type="button" id="btn-start" class="btn primary" disabled>학습 시작</button>
      </div>
    </section>

    <!-- ========== 2. 게임 화면 ========== -->
    <section id="screen-game" class="screen" aria-label="플래시카드 학습">
      <div class="hud">
        <button type="button" id="btn-pause" class="btn soft small" aria-label="일시정지">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
          <span>멈춤</span>
        </button>
        <div id="lives" class="lives" aria-label="남은 목숨"></div>
        <div class="hud-right">
          <span class="progress-pill"><b id="hud-progress">0</b> 남음</span>
          <button type="button" class="theme-btn small" data-theme-toggle aria-label="테마 바꾸기"></button>
        </div>
      </div>

      <div class="card-wrap">
        <div id="card" class="card">
          <!-- 앞면 -->
          <div class="face front">
            <div class="card-meta">
              <span id="card-day" class="chip"></span>
              <span id="card-src" class="chip outline"></span>
              <span id="timer-num" class="timer-num">60</span>
            </div>
            <div class="timer" aria-hidden="true"><div id="timer-bar" class="timer-bar"></div></div>
            <div class="word-block">
              <p id="card-word" class="word"></p>
              <p class="pron-line">
                <span id="card-pron" class="pron"></span>
                <button type="button" id="btn-speak" class="icon-btn" aria-label="발음 듣기">
                  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
              </p>
            </div>
            <div id="hint-box" class="hint-box" hidden></div>
            <p id="card-question" class="question"></p>
          </div>
          <!-- 뒷면 -->
          <div class="face back" aria-live="polite">
            <div class="back-head">
              <span id="back-verdict" class="verdict"></span>
              <span id="back-question" class="back-question"></span>
            </div>
            <p id="back-word" class="word small"></p>
            <p id="back-pron" class="pron"></p>
            <dl class="back-list">
              <div><dt>뜻</dt><dd id="back-meaning"></dd></div>
              <div id="back-deriv-row"><dt>유의어·파생어</dt><dd id="back-deriv"></dd></div>
              <div id="back-ex-row"><dt>예문</dt><dd id="back-ex" class="example"></dd></div>
            </dl>
          </div>
        </div>
      </div>

      <div id="choices" class="choices" role="group" aria-label="보기"></div>

      <div class="action-bar">
        <button type="button" id="btn-hint" class="btn soft">💡 힌트 보기 <kbd>H</kbd></button>
        <button type="button" id="btn-next" class="btn primary" hidden><span class="label">다음 단어</span> <kbd>Enter</kbd></button>
      </div>
    </section>

    <!-- ========== 3. 결과 화면 ========== -->
    <section id="screen-result" class="screen" aria-labelledby="result-title">
      <div class="result-card">
        <div id="result-emoji" class="result-emoji" aria-hidden="true"></div>
        <h1 id="result-title"></h1>
        <p id="result-sub" class="lede"></p>
        <div class="stats">
          <div class="stat ok"><span id="st-correct" class="stat-num">0</span><span class="stat-label">맞힘</span></div>
          <div class="stat bad"><span id="st-wrong" class="stat-num">0</span><span class="stat-label">틀림</span></div>
          <div class="stat hint"><span id="st-hint" class="stat-num">0</span><span class="stat-label">힌트 사용</span></div>
          <div class="stat"><span id="st-left" class="stat-num">0</span><span class="stat-label">남은 단어</span></div>
        </div>
        <div id="wrong-wrap" hidden>
          <h2>틀린 단어</h2>
          <ul id="wrong-list" class="wrong-list"></ul>
        </div>
        <div class="result-actions">
          <button type="button" id="btn-retry-wrong" class="btn soft">틀린 단어만 다시</button>
          <button type="button" id="btn-retry" class="btn soft">같은 설정으로 다시</button>
          <button type="button" id="btn-home" class="btn primary">Day 다시 고르기</button>
        </div>
      </div>
    </section>

    <!-- ========== 일시정지 ========== -->
    <div id="pause-overlay" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="overlay-box">
        <div class="result-emoji" aria-hidden="true">☕</div>
        <h2 id="pause-title">잠깐 쉬어가요</h2>
        <p>타이머가 멈췄어요. 카드는 다시 시작할 때까지 가려져요.</p>
        <div class="overlay-actions">
          <button type="button" id="btn-quit" class="btn soft">학습 종료</button>
          <button type="button" id="btn-resume" class="btn primary">계속하기</button>
        </div>
      </div>
    </div>
  </main>

  <script src="data/words.js"></script>
  <script src="app.js"></script>
</body>
</html>
